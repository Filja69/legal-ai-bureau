[tool.poetry]
name = "legal-ai-bureau-backend"
version = "0.1.0"
description = "Legal AI Bureau — Legal Agent backend"
authors = ["Legal AI Bureau"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
celery = {extras = ["redis"], version = "^5.4.0"}
pgvector = "^0.3.0"
anthropic = "^0.34.0"
openai = "^1.40.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# passlib 1.7.4 (unmaintained since 2020) predates bcrypt's 4.1 breaking
# changes (dropped `__about__`, enforces the 72-byte limit strictly instead
# of the old silent-truncate shim passlib's self-test relies on) — pinned
# below 4.1 so passlib's bcrypt backend actually initializes. Found by
# Phase 7's auth test suite; not a hypothetical.
bcrypt = "<4.1"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
structlog = "^24.2.0"
tenacity = "^8.4.0"
jsonschema = "^4.23.0"
pypdf = "^6.15.0"
python-docx = "^1.2.0"
openpyxl = "^3.1.5"
boto3 = "^1.43.72"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
mypy = "^1.10.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header()/Query() in argument defaults is the
# framework's documented idiom, not the antipattern this rule targets.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long Russian mock legal-text string literals — hand-wrapping them mid-sentence
# would hurt readability for no real benefit (LEGAL-SOURCES.md §13).
"app/sources/mock/dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
