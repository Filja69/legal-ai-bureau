# Render Blueprint — optional convenience for standing up the backend web
# service. Not required: Render also supports creating a single Web Service
# by hand from the dashboard (Docker runtime, dockerfilePath below, root
# directory ".") if this Blueprint's exact fields drift from Render's
# current schema — see docs/STAGING-DEPLOYMENT.md for that manual path,
# which is self-sufficient without this file.
#
# Frontend (Vercel) and database (Neon) are NOT services here — Render
# Blueprints only provision Render-hosted resources. Redis is deliberately
# NOT included: docs/STAGING-DEPLOYMENT-AUDIT.md §6 confirms nothing in
# this codebase actually uses Redis today; add a Render Key Value instance
# later if a real feature needs it.
services:
  - type: web
    name: legal-ai-bureau-backend
    runtime: docker
    dockerfilePath: infra/docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ready
    # Runs once per deploy, before the new instance is routed traffic.
    # alembic upgrade head is idempotent — safe to run on every deploy, and
    # a migration failure here fails the deploy rather than shipping a
    # backend that can't serve real requests (staging audit §15/§16). If
    # your Render plan/UI doesn't expose preDeployCommand, run this command
    # manually via Render's Shell before the first deploy instead.
    preDeployCommand: cd backend && poetry run alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Neon connection string — set manually, see docs/STAGING-DEPLOYMENT.md
      - key: JWT_SECRET
        generateValue: true # Render mints a random secret; never the insecure dev default
      - key: AUTH_DEV_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://<your-vercel-app>.vercel.app,http://localhost:3000
