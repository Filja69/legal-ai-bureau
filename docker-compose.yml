# Legal AI Bureau — local/dev stack. Minimal footprint per Task #10 scope:
# backend + frontend + PostgreSQL + Redis. No Celery worker, no nginx yet —
# added when Phase 2+ actually needs async task execution / reverse proxy.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal_ai_bureau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal_ai_bureau
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_ai_bureau_net

  redis:
    image: redis:7-alpine
    container_name: legal_ai_bureau_redis
    restart: unless-stopped
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_ai_bureau_net

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: legal_ai_bureau_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal:legal@postgres:5432/legal_ai_bureau
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal_ai_bureau_net

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: legal_ai_bureau_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
    ports:
      - "3010:3000"
    depends_on:
      - backend
    networks:
      - legal_ai_bureau_net

volumes:
  postgres_data:

networks:
  legal_ai_bureau_net:
